<!DOCTYPE html>
<html>
<head>
    <title>AI Agent</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #query { width: 300px; padding: 5px; }
        button { padding: 6px 15px; cursor: pointer; }
        #output { margin-top: 20px; white-space: pre-wrap; background: #f4f4f4; padding: 15px; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>
  <h2>AI Agent</h2>
  <input id="query" placeholder="Ask something..." />
  <button onclick="run()">Send</button>
  <pre id="output"></pre>

  <script>
    async function run() {
      let q = document.getElementById("query").value;
      document.getElementById("output").innerText = "Thinking...";
      try {
          let res = await fetch(`/agent?query=${encodeURIComponent(q)}`);
          let data = await res.json();
          document.getElementById("output").innerText = data.response;
      } catch (e) {
          document.getElementById("output").innerText = "Error: " + e;
      }
    }
  </script>
</body>
</html>
